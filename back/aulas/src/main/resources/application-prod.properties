# ---- Production profile ----

# Disable Swagger UI and OpenAPI docs in production.
# Exposed API contracts should not be publicly browsable in prod.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Enforce schema validation (Flyway manages DDL; Hibernate must not alter the schema).
spring.jpa.hibernate.ddl-auto=validate

# Bootstrap admin seeder: leave blank to skip creation in production.
# Set via environment variables when provisioning a fresh deployment.
app.seed.admin-password=
app.seed.admin-email=
app.seed.admin-username=admin
app.seed.admin-first-name=Admin
app.seed.admin-last-names=Sistema
app.seed.admin-departamento=Administración
