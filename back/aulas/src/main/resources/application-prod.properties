# ---- Production profile ----

# Disable Swagger UI and OpenAPI docs in production.
# Exposed API contracts should not be publicly browsable in prod.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Reconstructs scheme/host/port from X-Forwarded-* headers when running behind a trusted
# reverse proxy (Apache2 in this deployment). Needed for correct HTTPS links and redirects.
# Not set in dev, where there is no proxy in front of the app and X-Forwarded-* headers
# would be spoofable client input.
server.forward-headers-strategy=framework

# This deployment always runs behind Apache2 (see README.md for the required
# X-Forwarded-Proto directive). Without trust-proxy=true, RateLimitFilter would bucket
# every client under the proxy's own IP, letting one user's failed logins lock out
# everyone else.
app.rate-limit.trust-proxy=${APP_TRUST_PROXY:true}

# Never allow `flyway clean` to run in production — it drops every table.
spring.flyway.clean-disabled=true

# Bootstrap admin seeder.
# app.seed.admin-enabled=false is the explicit kill switch for skipping the seeder
# entirely (e.g. restoring from a backup that already has an ADMIN). Leave it true and
# provide the two variables below to bootstrap a fresh install; AdminSeeder refuses to
# start the application if neither path is satisfied on an empty `users` table — see
# AdminSeeder.java for the full fail-fast rationale.
app.seed.admin-enabled=${APP_SEED_ADMIN_ENABLED:true}
app.seed.admin-password=${APP_SEED_ADMIN_PASSWORD:}
app.seed.admin-email=${APP_SEED_ADMIN_EMAIL:}
