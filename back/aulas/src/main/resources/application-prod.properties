# ---- Production profile ----

# Disable Swagger UI and OpenAPI docs in production.
# Exposed API contracts should not be publicly browsable in prod.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Enforce schema validation — Hibernate must not alter the schema in production.
# Apply docs/reservations-refactor.sql manually before deploying.
spring.jpa.hibernate.ddl-auto=validate

# Bootstrap admin seeder: leave blank to skip creation in production.
# Set via APP_SEED_ADMIN_PASSWORD / APP_SEED_ADMIN_EMAIL when provisioning a fresh deployment.
app.seed.admin-password=${APP_SEED_ADMIN_PASSWORD:}
app.seed.admin-email=${APP_SEED_ADMIN_EMAIL:}
app.seed.admin-username=admin
app.seed.admin-first-name=Admin
app.seed.admin-last-names=Sistema
