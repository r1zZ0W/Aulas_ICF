spring.application.name=aulas
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/test_aulas
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JPA/Hibernate configuration
# ddl-auto=update lets Hibernate create/alter tables in dev; production uses 'validate'.
# Schema migrations are managed manually via SQL scripts in docs/.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# SQL logging is intentionally omitted here to prevent PII/password-hash leakage in
# production logs. Enable it only in the dev profile (application-dev.properties).

# Configuracion de correo SMTP
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Bootstrap admin seeder (AdminSeeder.java)
# Set via environment variables in production; dev defaults are in application-dev.properties.
app.seed.admin-password=${APP_SEED_ADMIN_PASSWORD:}
app.seed.admin-email=${APP_SEED_ADMIN_EMAIL:}
app.seed.admin-username=${APP_SEED_ADMIN_USERNAME:admin}
app.seed.admin-first-name=${APP_SEED_ADMIN_FIRST_NAME:Admin}
app.seed.admin-last-names=${APP_SEED_ADMIN_LAST_NAMES:Sistema}
app.seed.admin-departamento=${APP_SEED_ADMIN_DEPARTAMENTO:Administración}

jwt.secret=${JWT_SECRET}
# ts is on miliseconds, due to the fact that the JWT library we are using expects it in that format, but you can adjust it as needed
jwt.expiration=3600000
# 7 days
jwt.refresh-expiration=604800000

# Frontend base URL (used in password reset email links)
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# Never expose stack traces or Spring internals via the /error endpoint
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never

spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=10MB

# Rate limiting (RateLimitFilter)
# Maximum requests per IP within the window; override via env var APP_RATE_LIMIT_CAPACITY
app.rate-limit.capacity=${APP_RATE_LIMIT_CAPACITY:5}
# Refill window in minutes; override via env var APP_RATE_LIMIT_WINDOW_MINUTES
app.rate-limit.window-minutes=${APP_RATE_LIMIT_WINDOW_MINUTES:1}
# Set to true ONLY when deployed behind a trusted reverse proxy (nginx, AWS ALB, etc.)
# Enables X-Forwarded-For trust for real-IP resolution; false = use remoteAddr directly
app.rate-limit.trust-proxy=${APP_TRUST_PROXY:false}
