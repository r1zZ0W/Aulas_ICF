spring.application.name=aulas
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/test_aulas
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Configuracion de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update

# Enable basic SQL logging to the console
spring.jpa.show-sql=true

# Format the SQL queries to make them highly readable
spring.jpa.properties.hibernate.format_sql=true

# Log the actual parameter values bound to the SQL placeholders (?)
logging.level.org.hibernate.orm.jdbc.bind=trace

# Configuracion de correo SMTP
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

jwt.secret=${JWT_SECRET}
# ts is on miliseconds, due to the fact that the JWT library we are using expects it in that format, but you can adjust it as needed
jwt.expiration=3600000
# 7 days
jwt.refresh-expiration=604800000

# Redis (token blacklist for revoked JWTs)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Frontend base URL (used in password reset email links)
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# Never expose stack traces or Spring internals via the /error endpoint
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never

# Rate limiting (RateLimitFilter)
# Maximum requests per IP within the window; override via env var APP_RATE_LIMIT_CAPACITY
app.rate-limit.capacity=${APP_RATE_LIMIT_CAPACITY:5}
# Refill window in minutes; override via env var APP_RATE_LIMIT_WINDOW_MINUTES
app.rate-limit.window-minutes=${APP_RATE_LIMIT_WINDOW_MINUTES:1}
# Set to true ONLY when deployed behind a trusted reverse proxy (nginx, AWS ALB, etc.)
# Enables X-Forwarded-For trust for real-IP resolution; false = use remoteAddr directly
app.rate-limit.trust-proxy=${APP_TRUST_PROXY:false}
