spring.application.name=aulas
spring.profiles.default=dev

# spring.config.import is intentionally NOT declared here. It lives only in
# application-dev.properties: a .env file must never be able to influence which
# profile is active or inject anything into a production process. Production
# configuration comes exclusively from the environment (see application-prod.properties
# and the systemd EnvironmentFile documented in README.md).

# Bare placeholders — no default. If any of these is unresolved at startup, Spring Boot
# aborts immediately with "Could not resolve placeholder '<NAME>'". This is deliberate:
# it is the fail-fast mechanism for anything that must never silently fall back to an
# insecure or empty value in production. application-dev.properties supplies local
# defaults for all of them.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JPA/Hibernate configuration
# Flyway (see below) is the single owner of the schema in both profiles. Hibernate
# never creates or alters tables — it only validates that the entities match what
# Flyway already applied.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# SQL logging is intentionally omitted here to prevent PII/password-hash leakage in
# production logs. Enable it only in the dev profile (application-dev.properties).

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Mail Configurations via SMTP
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

jwt.secret=${JWT_SECRET}
# Expressed in milliseconds — the JWT library we use (jjwt) expects epoch millis for its
# expiration claim. 14400000 ms = 4 hours.
jwt.expiration=14400000
# 604800000 ms = 7 days
jwt.refresh-expiration=604800000

# Frontend base URL (used in password reset email links)
app.frontend-url=${APP_FRONTEND_URL}

# Main mailbox used for admin notifications; CC recipients are added on top of it.
# No default: an unset value must fail startup rather than silently drop notifications.
app.notifications.super-admin-email=${APP_NOTIFICATIONS_SUPER_ADMIN_EMAIL}

# Never expose stack traces or Spring internals via the /error endpoint
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never

spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=10MB

# Rate limiting (RateLimitFilter)
# Maximum requests per IP within the window; override via env var APP_RATE_LIMIT_CAPACITY
app.rate-limit.capacity=${APP_RATE_LIMIT_CAPACITY:25}
# Refill window in minutes; override via env var APP_RATE_LIMIT_WINDOW_MINUTES
app.rate-limit.window-minutes=${APP_RATE_LIMIT_WINDOW_MINUTES:1}
# Set to true ONLY when deployed behind a trusted reverse proxy (Apache2, nginx, AWS ALB,
# etc.). Enables X-Forwarded-For trust for real-IP resolution; false = use remoteAddr
# directly. Defaults differ per profile: false in dev (no proxy in front of it), true in
# prod (this deployment always sits behind Apache2) — see application-{dev,prod}.properties.
app.rate-limit.trust-proxy=${APP_TRUST_PROXY:false}

# ── Reservations domain ───────────────────────────────────────────────────────
# Duration of a single time slot in minutes. This is the single source of truth
# for slot-to-hours conversion used by ReservationSlotProperties (reports, capacity
# calculations, etc.). Change this value if the institution adopts a different block length.
app.reservations.slot-duration-minutes=30

# Subfolder (relative to app.storage.base-dir) where student roster .xlsx files are stored.
app.reservations.storage-dir=student-lists

# ── Kernel: local file storage (FileStorageService) ────────────────────────────
# Global root directory for all server-side file storage. Module-specific services
# (e.g. reservations student rosters) resolve their own subfolder under this root.
# No default: a missing STORAGE_BASE_DIR in production must fail startup, not silently
# write into a ./data relative to whatever the process's working directory happens to be.
app.storage.base-dir=${STORAGE_BASE_DIR}

# Desactiva la evaluación de condiciones repetidas en el arranque
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.admin.SpringApplicationAdminJmxAutoConfiguration
# Lazy initialization is a dev-only convenience (faster iterative restarts). Disabled here so
# production fails fast on bean-wiring errors at startup instead of on first request.
# Re-enabled in application-dev.properties.
spring.main.lazy-initialization=false

spring.jpa.open-in-view=false
