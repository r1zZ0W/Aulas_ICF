# ---- Development profile ----
# Token blacklist and login-attempt counters use the Caffeine-backed in-memory
# implementation (InMemoryTokenBlacklistService / LoginAttemptService). No external
# caching infrastructure is required.

# Loads back/aulas/.env (or a repo-root .env) when the process runs with that directory
# as its working directory. Both are optional — the app still starts without a .env,
# falling back to the local defaults below. This import is intentionally scoped to the
# dev profile only: production never has a .env in its working directory, so nothing
# here can affect it.
#
# IMPORTANT: never put SPRING_PROFILES_ACTIVE in that .env file. Declaring a profile
# from a config source imported this way conflicts with the profile Spring Boot is
# already resolving and breaks startup — see .env.example for the same warning at the
# point where it would actually be typed.
spring.config.import=optional:file:back/aulas/.env[.properties],optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/test_aulas
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# Both Vite ports are allowed: 5173 is the dev server, 4173 is `vite preview`.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:5174}

app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

app.notifications.super-admin-email=${APP_NOTIFICATIONS_SUPER_ADMIN_EMAIL:admin@icf.unam.mx}

app.storage.base-dir=${STORAGE_BASE_DIR:./data}

# Local-only JWT secret so the app can start without requiring an env var.
# Replace it in shared environments.
jwt.secret=${JWT_SECRET:dev-only-jwt-secret-change-me-please-0123456789}

# SQL logging — dev only to avoid PII/hash leakage in production logs.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=trace

# Bootstrap admin seeder — dev defaults.
# Create an initial ADMIN user on first startup against a clean database.
# Change these values, or set app.seed.admin-enabled=false, to disable seeding.
app.seed.admin-password=Admin@12345!
app.seed.admin-email=admin@icf.unam.mx

# Lazy initialization speeds up iterative restarts during development. Disabled in the base
# application.properties for production (fail-fast bean wiring); re-enabled here for dev only.
spring.main.lazy-initialization=true
