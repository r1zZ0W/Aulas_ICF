# ---- Development profile ----
# Redis is not required in this environment.
# Token blacklist uses Caffeine-backed in-memory cache (InMemoryTokenBlacklistService).
# RedisTokenBlacklistService is gated by @Profile("prod") and is never instantiated here.

# Explicitly exclude Redis auto-configuration to prevent Actuator health checks from
# attempting a Redis connection and crashing the application in environments without Redis.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# SQL logging — dev only to avoid PII/hash leakage in production logs.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=trace
